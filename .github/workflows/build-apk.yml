name: Build Android APK

on:
  push:
    branches: [ main, master ] # Hangi branch'e kod gelince çalışacağını belirler

jobs:
  buildForAndroid:
    name: Build for Android 📱
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android

      - name: Build Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }} # Unity lisans anahtarın
        with:
          targetPlatform: Android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android
